<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>세종고GTA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;500;700;900&family=Noto+Serif+KR:wght@600;900&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: full-bleed 3D canvas. Start screen = left column over a slowly orbiting campus; pause = centered purple-gold card; HUD in the corners inside the safe area. */
:root{
  --ink:#f3eee4; --ink-2:#cfc6de; --ink-3:#9a91ad;
  --panel:rgba(24,19,40,.78); --panel-2:rgba(40,32,66,.9); --line:rgba(255,255,255,.14);
  --purple:#5c4b94; --purple-2:#7a67b8; --gold:#d6b25e; --gold-ink:#20180a;
  --f-display:"Noto Serif KR","Nanum Myeongjo",serif;
  --f-body:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%;margin:0;overflow:hidden;background:#120f1d;color:var(--ink);font-family:var(--f-body);-webkit-user-select:none;user-select:none}
#c{position:fixed;inset:0;display:block;width:100%;height:100%;touch-action:none;outline:none}
.hud{position:fixed;z-index:5;pointer-events:none}
/* in game nothing is on screen but the minimap; the top-right buttons are for touch, which has no Esc */
#tr{display:none;top:calc(14px + env(safe-area-inset-top,0px));right:calc(16px + env(safe-area-inset-right,0px));gap:8px;align-items:center;pointer-events:auto}
body.touch #tr{display:flex}
.seg{display:flex;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:3px;backdrop-filter:blur(8px)}
.seg button,.btn{font:inherit;font-size:13px;color:var(--ink-2);background:none;border:0;border-radius:999px;padding:6px 12px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--gold);color:var(--gold-ink);font-weight:700}
.btn{background:var(--panel);border:1px solid var(--line);backdrop-filter:blur(8px);color:var(--ink)}
.btn:hover,.seg button:hover{color:var(--ink)}
button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
#mm{left:calc(16px + env(safe-area-inset-left,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));pointer-events:auto;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:6px;backdrop-filter:blur(8px)}
#mm canvas{display:block;width:150px;height:193px;cursor:crosshair;border-radius:6px}

.btn.met{background:#b4471f;border-color:#e0874f;color:#fff3e6;font-weight:700}
.btn.met:hover{filter:brightness(1.1)}
#tbtn #tmet{background:#b4471f;border-color:#e0874f}
#cross{top:50%;left:50%;width:4px;height:4px;margin:-2px 0 0 -2px;border-radius:50%;background:rgba(255,255,255,.75);box-shadow:0 0 0 1px rgba(0,0,0,.35)}
.overlay{position:fixed;inset:0;z-index:10;display:grid;place-items:safe center;background:radial-gradient(120% 90% at 50% 40%,rgba(30,22,54,.55),rgba(12,9,22,.88));padding:16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));overflow:auto}
.card{width:min(560px,100%);background:var(--panel-2);border:1px solid rgba(214,178,94,.35);border-radius:16px;padding:26px 24px 22px;box-shadow:0 30px 80px rgba(0,0,0,.5);position:relative}
.card::before{content:"";position:absolute;inset:6px;border:1px solid rgba(214,178,94,.18);border-radius:12px;pointer-events:none}
.card .eb{font-size:11.5px;letter-spacing:.16em;color:var(--gold);font-weight:700}
.card h1{font-family:var(--f-display);font-weight:900;font-size:clamp(28px,6vw,40px);margin:8px 0 6px;line-height:1.1;text-wrap:balance}
.card p{color:var(--ink-2);font-size:14px;line-height:1.65;margin:0 0 16px;max-width:62ch}
.keys{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;font-size:13px;color:var(--ink-2);margin:0 0 18px}
.keys b{font-family:var(--f-mono);font-weight:500;font-size:12px;color:var(--ink);background:rgba(255,255,255,.08);padding:2px 7px;border-radius:5px;justify-self:start}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.go{font:inherit;font-weight:700;font-size:15px;background:var(--gold);color:var(--gold-ink);border:0;border-radius:10px;padding:12px 20px;cursor:pointer}
.go:hover{filter:brightness(1.08)}
.lbl{font-size:12px;color:var(--ink-3);margin:0 0 6px;letter-spacing:.06em}
#loading .card{text-align:center}
#loadmsg{font-family:var(--f-mono);font-size:12px;color:var(--ink-3);margin-top:10px}
.bar{height:3px;background:rgba(255,255,255,.1);border-radius:3px;overflow:hidden;margin-top:14px}
.bar i{display:block;height:100%;width:0;background:var(--gold);transition:width .3s}
#joy{left:calc(28px + env(safe-area-inset-left,0px));bottom:calc(28px + env(safe-area-inset-bottom,0px));width:120px;height:120px;border-radius:50%;background:rgba(20,16,34,.35);border:1px solid var(--line);pointer-events:auto;touch-action:none}
#joy i{position:absolute;left:50%;top:50%;width:48px;height:48px;margin:-24px;border-radius:50%;background:rgba(214,178,94,.55)}
#tbtn{right:calc(20px + env(safe-area-inset-right,0px));bottom:calc(28px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:10px;pointer-events:auto}
#tbtn button{width:64px;height:64px;border-radius:50%;font:inherit;font-size:13px;font-weight:700;color:var(--ink);background:var(--panel);border:1px solid var(--line)}
body.touch #mm{bottom:auto;top:calc(78px + env(safe-area-inset-top,0px))}
body.touch #mm canvas{width:110px;height:141px}
.mi{font:inherit;font-family:"Black Han Sans",var(--f-body);font-weight:400;font-size:clamp(19px,2.0vw,29px);color:#fff;background:none;border:0;border-radius:4px;padding:6px 15px;cursor:pointer;text-align:left;line-height:1.3;transition:background-color .12s,color .12s}
.mi[aria-current="true"]{background:#f5c518;color:#1a1408}
.mi:focus-visible{outline:2px solid #f5c518;outline-offset:2px}
.st-menu{display:flex;flex-direction:column;align-items:flex-start;gap:1px}
.st-panel{margin-top:18px;max-height:min(38vh,320px);overflow:auto;font-size:12.5px;color:var(--ink-2)}
.st-panel .ks{display:grid;grid-template-columns:auto 1fr;gap:6px 10px;align-items:center}
.st-panel b{font-family:var(--f-mono);font-weight:500;font-size:10.5px;color:#fff;background:rgba(255,255,255,.1);padding:2px 7px;border-radius:4px;white-space:nowrap;justify-self:start}
.st-panel span{line-height:1.45;word-break:keep-all}
.st-panel .seg{display:inline-flex}
.st-panel .back{margin-top:14px;font-size:11.5px;color:var(--ink-3);letter-spacing:.02em}
.st-panel .lbl{margin:0 0 8px}
.pts-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;margin:4px 0 8px}
.pts-head .lbl{margin:0}
.pts-actions{display:flex;gap:6px;flex-wrap:wrap}
.mini{font:inherit;font-size:12px;color:var(--ink);background:rgba(255,255,255,.06);border:1px solid var(--line);border-radius:8px;padding:6px 10px;cursor:pointer}
.mini:hover{border-color:var(--gold)}
.mini.gold{background:var(--gold);color:var(--gold-ink);border-color:var(--gold);font-weight:700}
.mini.warn{border-color:#d9776a;color:#ffd2ca}
#ptList{display:flex;flex-direction:column;gap:6px;margin:0 0 16px;max-height:min(42vh,360px);overflow:auto;padding-right:2px}
.pt{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:10px;padding:6px 8px;min-width:0}
.pt img,.pt .noimg{width:72px;height:45px;object-fit:cover;border-radius:6px;background:#2a2340;display:block}
.pt .no{font-family:var(--f-mono);font-weight:500;color:var(--gold);font-size:13px}
.pt .meta{min-width:0;display:flex;flex-direction:column;gap:3px}
.pt .meta small{color:var(--ink-3);font-size:11px;font-family:var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pt input{font:inherit;font-size:12.5px;color:var(--ink);background:rgba(0,0,0,.2);border:1px solid var(--line);border-radius:6px;padding:4px 7px;width:100%;min-width:0;box-sizing:border-box}
.pt input:focus{outline:2px solid var(--gold);outline-offset:0}
.pt .btns{display:flex;flex-direction:column;gap:4px}
.empty{font-size:13px;color:var(--ink-3);border:1px dashed var(--line);border-radius:10px;padding:12px;line-height:1.6}
#ptStatus{font-size:12px;color:var(--ink-3);margin:-4px 0 8px;line-height:1.5}
#copyBox{width:100%;box-sizing:border-box;height:90px;font-family:var(--f-mono);font-size:11px;background:rgba(0,0,0,.3);color:var(--ink);border:1px solid var(--line);border-radius:8px;margin:0 0 12px}
#prompt{left:50%;bottom:calc(76px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--panel-2);border:1px solid rgba(214,178,94,.5);border-radius:999px;padding:9px 18px;font-size:14px;font-weight:700;color:var(--ink)}
#prompt b{font-family:var(--f-mono);font-weight:500;font-size:12px;background:var(--gold);color:var(--gold-ink);padding:2px 7px;border-radius:5px;margin-right:6px}
#tbtn #tcar{background:var(--gold);color:var(--gold-ink);border-color:var(--gold)}
#toast{left:50%;top:calc(70px + env(safe-area-inset-top,0px));transform:translateX(-50%);background:var(--gold);color:var(--gold-ink);font-weight:700;font-size:14px;padding:9px 16px;border-radius:999px;box-shadow:0 8px 24px rgba(0,0,0,.35)}
/* start screen */
body.title .hud{display:none!important}
#start{position:fixed;inset:0;z-index:10;display:flex;align-items:stretch;overflow:hidden}
#start .artbg{position:absolute;inset:0;background:#0b0813;opacity:0;transition:opacity 1.3s ease;pointer-events:none}
#start .art{position:absolute;top:0;bottom:0;right:0;width:76%;height:100%;object-fit:cover;object-position:52% 34%;opacity:0;transition:opacity 1.3s ease;pointer-events:none}
#start .art.on,#start .artbg.on{opacity:1}
@media (prefers-reduced-motion:reduce){#start .art,#start .artbg{transition:none}}
#start .bg{position:absolute;inset:0;pointer-events:none;background:linear-gradient(90deg,#0b0813 0%,#0b0813 56%,rgba(11,8,19,.9) 80%,rgba(11,8,19,0) 100%);clip-path:polygon(0 0,31% 0,20% 100%,0 100%)}
.st{position:relative;z-index:1;display:flex;flex-direction:column;justify-content:center;width:min(32vw,430px);min-width:264px;box-sizing:border-box;padding:0 20px 0 max(clamp(22px,4.2vw,62px),env(safe-area-inset-left,0px))}
.st-title{margin:0 0 32px;font-family:"Black Han Sans",var(--f-body);font-weight:400;color:#fff;line-height:.88;letter-spacing:-.01em}
.st-title i{display:block;font-style:normal;font-size:clamp(32px,4.2vw,60px)}
.st-title span{display:block;font-style:italic;font-size:clamp(54px,7.4vw,104px);transform:skewX(-7deg);transform-origin:left bottom}
.st-title i,.st-title span{text-shadow:2px 2px 0 #15121f,-2px 2px 0 #15121f,2px -2px 0 #15121f,-2px -2px 0 #15121f,0 12px 34px rgba(0,0,0,.6)}
.st-enter{margin-top:34px;display:flex;align-items:center;gap:11px;font-size:12.5px;color:rgba(243,238,228,.72)}
.st-enter kbd{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.1em;border:1px solid rgba(255,255,255,.45);border-radius:999px;padding:4px 12px;color:#fff}
body.touch .st-enter{display:none}
@media (max-width:760px){
  #start{align-items:flex-end}
  #start .bg{clip-path:none;background:linear-gradient(0deg,#0b0813 0%,rgba(11,8,19,.88) 36%,rgba(11,8,19,0) 70%)}
  .st{width:100%;min-width:0;justify-content:flex-end;padding:0 18px calc(26px + env(safe-area-inset-bottom,0px))}
  .st-title{margin-bottom:16px}
  #start .art{width:100%;object-position:50% 26%}
}
/* pause */
.pcard{width:min(420px,100%);background:#0f0c1a;border:1px solid var(--line);border-radius:14px;padding:22px 20px 20px;box-shadow:0 30px 80px rgba(0,0,0,.55)}
.pz-title{font-size:11.5px;letter-spacing:.2em;color:var(--gold);font-weight:700;margin:0 0 14px;padding-left:15px}
#ptsWrap{margin-top:16px}
details.pts{border-top:1px solid var(--line);padding-top:12px}
details.pts summary{cursor:pointer;font-size:13px;color:var(--ink-2);display:flex;justify-content:space-between;gap:8px;list-style:none;padding:2px 0 10px}
details.pts summary::-webkit-details-marker{display:none}
details.pts summary::after{content:"펼치기";color:var(--ink-3);font-size:12px}
details.pts[open] summary::after{content:"접기"}
@media (max-width:560px){.seg button{padding:6px 9px} .pt{grid-template-columns:auto 1fr} .pt .btns{grid-column:1/-1;flex-direction:row}}
</style>

<canvas id="c" tabindex="0" aria-label="세종고등학교 3D 캠퍼스"></canvas>

<div class="hud" id="tr">
  <button class="btn met" id="metBtn" title="보는 곳에 운석 떨어뜨리기 (클릭 · G)" hidden>운석</button>
  <button class="btn" id="menuBtn" title="메뉴 (Esc · M)">메뉴</button>
</div>
<div class="hud" id="cross" hidden></div>
<div class="hud" id="mm"><canvas id="mmc" width="300" height="386" aria-label="미니맵"></canvas></div>
<div class="hud" id="toast" role="status" hidden></div>
<div class="hud" id="prompt" hidden></div>
<div class="hud" id="joy" hidden><i id="knob"></i></div>
<div class="hud" id="tbtn" hidden><button id="tcar" hidden>타기</button><button id="tmet" hidden>운석</button><button id="tpunch">주먹</button><button id="tjump">점프</button><button id="tfly" hidden>비행</button></div>

<div class="overlay" id="loading">
  <div class="card"><h1>세종고GTA</h1><div class="bar"><i id="pbar"></i></div><div id="loadmsg">준비 중</div></div>
</div>

<div id="start" hidden>
  <div class="artbg" id="stArtBg"></div>
  <img class="art" id="stArt" src="art/students.jpg" alt="" aria-hidden="true" decoding="async">
  <div class="bg"></div>
  <div class="st">
    <h1 class="st-title"><i>세종고</i><span>GTA</span></h1>
    <nav class="st-menu" id="stMenu" aria-label="시작 메뉴">
      <button class="mi" data-act="walk">게임 시작</button>
      <button class="mi" data-act="meteor">운석 모드</button>
      <button class="mi" data-act="keys">조작법</button>
      <button class="mi" data-act="gfx">설정</button>
    </nav>
    <div class="st-panel" id="stPanel" hidden></div>
    <div class="st-enter"><kbd>ENTER</kbd> 시작</div>
  </div>
</div>

<div class="overlay" id="pause" hidden>
  <div class="pcard">
    <div class="pz-title">일시정지</div>
    <nav class="st-menu" id="pzMenu" aria-label="일시정지 메뉴">
      <button class="mi" data-pact="resume">계속하기</button>
      <button class="mi" data-pact="keys">조작법</button>
      <button class="mi" data-pact="gfx">설정</button>
      <button class="mi" data-pact="restore" hidden>학교 되돌리기</button>
      <button class="mi" data-pact="title">처음 화면으로</button>
    </nav>
    <div class="st-panel" id="pzPanel" hidden></div>
    <div id="ptsWrap" hidden>
      <details class="pts" id="ptsBox">
        <summary id="ptsSum">사진 맞춤 지점</summary>
        <div class="pts-head"><div class="lbl">번호를 찍어 사진과 함께 보내면 그 위치를 고쳐요</div>
          <div class="pts-actions"><button class="mini gold" id="markHere">지금 화면 저장</button><button class="mini" id="togglePins">번호 표시 끄기</button><button class="mini" id="copyPts">목록 복사</button></div></div>
        <div id="ptStatus">사진과 같은 구도가 보이면 <b>P</b>를 누르세요.</div>
        <textarea id="copyBox" readonly hidden aria-label="지점 목록 텍스트"></textarea>
        <div id="ptList"><div class="empty">아직 저장한 지점이 없어요.</div></div>
      </details>
    </div>
  </div>
</div>

<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'three';
import { Sky } from 'three/addons/objects/Sky.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { GTAOPass } from 'three/addons/postprocessing/GTAOPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { SMAAPass } from 'three/addons/postprocessing/SMAAPass.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

const $ = s => document.querySelector(s);
const V3 = THREE.Vector3;
const tick = () => new Promise(r => requestAnimationFrame(() => r()));
let prog = 0;
const step = (msg, p) => { $('#loadmsg').textContent = msg; $('#pbar').style.width = p + '%'; };

/* ---------- coordinates: satellite screenshot pixels → meters (0.25 m/px) ---------- */
const S = 0.25, OX = 430, OZ = 480;
const X = p => (p - OX) * S, Z = p => (p - OZ) * S;
const PX = x => x / S + OX, PZ = z => z / S + OZ;

function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const R = mulberry32(1926);
const rr = (a,b) => a + (b-a)*R();
const pick = a => a[Math.floor(R()*a.length)];

const isTouch = matchMedia('(pointer:coarse)').matches;
if (isTouch) document.body.classList.add('touch');

/* ---------- renderer / scene ---------- */
const canvas = $('#c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio, isTouch ? 1.5 : 1.75));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.6;
renderer.outputColorSpace = THREE.SRGBColorSpace;
const ANISO = Math.min(8, renderer.capabilities.getMaxAnisotropy());

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(72, innerWidth/innerHeight, 0.15, 4500);
camera.rotation.order = 'YXZ';

const sky = new Sky(); sky.scale.setScalar(9000); scene.add(sky);
const su = sky.material.uniforms;
const hemi = new THREE.HemisphereLight(0xc9dcff, 0x6a5a40, 0.8); scene.add(hemi);
const sun = new THREE.DirectionalLight(0xffd6a8, 3);
sun.castShadow = true;
sun.shadow.mapSize.set(isTouch ? 2048 : 4096, isTouch ? 2048 : 4096);
Object.assign(sun.shadow.camera, { left:-150, right:150, top:150, bottom:-150, near:10, far:1000 });
sun.shadow.bias = -0.0007; sun.shadow.normalBias = 0.09;
const CENTER = new V3(X(470), 0, Z(500));
sun.target.position.copy(CENTER);
scene.add(sun, sun.target);
scene.fog = new THREE.Fog(0xd9c2a8, 260, 2600);

/* ---------- graphics quality: sky probe (IBL) + post-processing ---------- */
// GFX 0 = 낮은 (직접 렌더) · 1 = 중간 (SMAA + 분름) · 2 = 높은 (+ GTAO 엑스브루전)
// Measured on this scene at 1024x768: 0 -> 60fps, 1 -> 58fps, 2 -> 23fps. GTAO re-renders the
// whole campus for depth and normals every frame, so it stays opt-in rather than the default.
let GFX = isTouch ? 0 : 1;
try { const g = localStorage.getItem('sejong3d.gfx'); if (g !== null) GFX = Math.max(0, Math.min(2, +g | 0)); } catch (_) {}
const CAN_PP = renderer.capabilities.isWebGL2;
let composer = null, gtaoPass = null, envRT = null;
const ALLMATS = new Set(), AO_HIDE = [];

// Bake the Sky shader into a prefiltered probe: without this every material has nothing to
// reflect, which is what makes untextured boxes read as plastic.
const pmrem = new THREE.PMREMGenerator(renderer);
const envSky = new Sky(); envSky.scale.setScalar(9000);
const envScene = new THREE.Scene(); envScene.add(envSky);
function bakeEnv(){
  const u = envSky.material.uniforms;
  u.turbidity.value = su.turbidity.value; u.rayleigh.value = su.rayleigh.value;
  u.mieCoefficient.value = su.mieCoefficient.value; u.mieDirectionalG.value = su.mieDirectionalG.value;

function arcText(g,text,cx,cy,rad,center,spread,bottom){
  const n=text.length;
  for(let i=0;i<n;i++){ const t=n===1?0:(i/(n-1)-.5); const a=center+(bottom?-t:t)*spread;
    g.save(); g.translate(cx+Math.cos(a)*rad, cy+Math.sin(a)*rad); g.rotate(bottom?a-Math.PI/2:a+Math.PI/2); g.fillText(text[i],0,0); g.restore(); }
}

function menuNav(rootSel, panelSel, onPick){
  const root=$(rootSel), panel=$(panelSel);
  const items=()=>[...root.querySelectorAll('.mi')].filter(b=>!b.hidden);
  const M={ root, panel, i:0, open:null };
  M.paint=()=>{ const it=items(); M.i=Math.max(0,Math.min(M.i,it.length-1)); it.forEach((b,k)=>b.setAttribute('aria-current', String(k===M.i))); };
  M.move=d=>{ const it=items(); if(!it.length) return; M.i=(M.i+d+it.length)%it.length; M.paint(); it[M.i].focus({preventScroll:true}); };
  M.pick=()=>{ const it=items(); if(it[M.i]) onPick(it[M.i].dataset.act||it[M.i].dataset.pact); };
  M.reset=()=>{ M.i=0; M.paint(); };
  root.addEventListener('pointermove',e=>{ const b=e.target.closest('.mi'); if(b && !b.hidden){ M.i=items().indexOf(b); M.paint(); } });
  root.addEventListener('click',e=>{ const b=e.target.closest('.mi'); if(!b) return; e.stopPropagation(); M.i=items().indexOf(b); M.paint(); onPick(b.dataset.act||b.dataset.pact); });
  M.paint();

}

const FIELD=rectOf([452,442,690,800]);           // the rect buildField() paints

// a truncated-icosahedron look: the 12 icosahedron vertices painted onto an equirect map,
// with the horizontal radius divided by sin(theta) to undo the projection's stretch
function ballTex(){
  const W=1024,H=512, c=cvs(W,H), g=c.getContext('2d');
  g.fillStyle='#f5f5f1'; g.fillRect(0,0,W,H);
  const t=(1+Math.sqrt(5))/2, V=[];
  for(const [a,b] of [[1,t],[-1,t],[1,-t],[-1,-t]]) for(const k of [0,1,2]){ const v=[0,0,0]; v[k]=a; v[(k+1)%3]=b; V.push(v); }
  for(const v of V){
    const L=Math.hypot(v[0],v[1],v[2]), x=v[0]/L, y=v[1]/L, z=v[2]/L;
    const th=Math.acos(Math.max(-1,Math.min(1,y))), ph=Math.atan2(z,x);
    const cy=th/Math.PI*H, cx=(ph/(2*Math.PI)+.5)*W, ry=44, rx=ry/Math.max(.3,Math.sin(th));
    for(const du of [-W,0,W]){
      g.fillStyle='#17171c'; g.beginPath();
      for(let i=0;i<5;i++){ const a2=i/5*6.2832-Math.PI/2, px=cx+du+Math.cos(a2)*rx, py=cy+Math.sin(a2)*ry; i?g.lineTo(px,py):g.moveTo(px,py); }
      g.closePath(); g.fill();
    }
  }
  for(let i=0;i<2600;i++){ g.fillStyle=`rgba(${R()<.5?'255,255,255':'90,90,95'},.07)`; g.fillRect(R()*W,R()*H,3,3); }
  return c;
}

function ballSound(pw,metal){ const ac=audio(); if(!ac) return; const sp=spot(BALL.m.position,5,1,.2,0), t=sp.t;

  env(g,t,.002,(metal?.22:.4)*pw,metal?.26:.1); s.connect(f).connect(g).connect(sp.mix); s.start(t,Math.random()*2); s.stop(t+.35);
